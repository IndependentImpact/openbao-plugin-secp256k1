name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins the exact patched toolchain (SEC-001); do not float on
          # a minor-version alias here.
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Vulnerability gate (SEC-001)
        # A reachable finding fails the build. Module-level findings the code
        # never calls are reported but do not fail (govulncheck default).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -o bin/openbao-plugin-secp256k1_linux_amd64 ./cmd
      - name: Build (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags '-s -w' -o bin/openbao-plugin-secp256k1_linux_arm64 ./cmd
      - name: Checksums
        run: cd bin && sha256sum * > checksums.txt && cat checksums.txt

  integration:
    # SEC-004: live OpenBao evidence — audit events for the sign op (input
    # HMAC'd, no private material), mount tuned seal_wrap=true, and negative
    # export/backup/restore probes, against the pinned OpenBao release.
    runs-on: ubuntu-latest
    env:
      OPENBAO_VERSION: "2.6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install OpenBao ${{ env.OPENBAO_VERSION }}
        run: |
          curl -fsSLo bao.deb "https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}/bao_${OPENBAO_VERSION}_linux_amd64.deb"
          sudo dpkg -i bao.deb
          bao --version
      - run: ./scripts/integration-openbao.sh
